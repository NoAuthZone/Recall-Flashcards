<script>
'use strict';
/* ================= Sprache ================= */
let LANG='de';
const EN={}; // deutscher Text -> englischer Text (siehe 60_i18n.js)
const t=(k,...a)=>{let r=(LANG==='en'&&EN[k])||k;a.forEach((v,i)=>{r=r.split('{'+i+'}').join(v)});return r};
const LOC=()=>LANG==='en'?'en-GB':'de'+'-DE';
const STATIC_SEL='header h1, nav button, footer button, .skip';

/* ================= Helfer ================= */

const urlCache=new Map();
async function commit(puts={},dels={}){
  if(dels.media){dels={...dels};delete dels.media} // Medien werden verzögert aufgeräumt (gcMedia), damit Schnappschüsse wiederherstellbar bleiben
  const names=[...new Set([...Object.keys(puts),...Object.keys(dels)])].filter(k=>(puts[k]&&puts[k].length)||(dels[k]&&dels[k].length));
  if(!names.length)return;
  await DB.tx(names,tr=>{names.forEach(n=>{const os=tr.objectStore(n);(puts[n]||[]).forEach(o=>os.put(o));(dels[n]||[]).forEach(id=>os.delete(id))})});
  applyCommitted(puts,dels,names);
}
function applyCommitted(puts,dels,names){
  const m={cards:S.cards,states:S.states,decks:S.decks};
  for(const n of names){
    if(m[n]){(puts[n]||[]).forEach(o=>m[n].set(o.id,o));(dels[n]||[]).forEach(id=>m[n].delete(id))}
    if(n==='media'){[...(puts.media||[]).map(o=>o.id),...(dels.media||[])].forEach(id=>{if(urlCache.has(id)){URL.revokeObjectURL(urlCache.get(id));urlCache.delete(id)}})}
  }
  S.rev++;
  if(typeof syncDirty==='function')syncDirty();
}

const FW=[0.5701,1.4436,4.1386,10.9355,5.1443,1.2006,0.8627,0.0362,1.629,0.1342,1.0166,2.1174,0.0839,0.3204,1.4676,0.219,2.8237];
const FAC=19/81,DEC=-0.5;
const fsR=(tt,s)=>Math.pow(1+FAC*tt/s,DEC);

const clD=d=>Math.min(10,Math.max(1,d));
const fsInit=g=>({stab:Math.max(.1,FW[g-1]),diff:clD(FW[4]-(g-3)*FW[5])});
function fsNext(stab,diff,g,tt){

  return {stab:Math.max(.1,ns),diff:nd};
}

// 1 Nochmal, 2 Schwer, 3 Gut, 4 Leicht. Gibt {s:neuerZustand, meta:{kind,lapse}} zurück (ohne Seiteneffekte)
function schedule(st,r,o,cap,now=Date.now()){
  const s={...st},steps=parseSteps(o.steps),rs=parseSteps(o.relearn),fs=o.algo==='fsrs',day=dayStart(now);
  const wasNew=st.status==='new';
  const meta={lapse:false,kind:wasNew?'new':st.status==='review'?'review':(st.relearn?'relearn':'learn')};
  if(wasNew){s.introduced=st.introduced||now;s.ease=o.startEase;s.step=0;s.relearn=false}
  s.reps=(st.reps||0)+1;s.last=now;
  if(fs&&s.stab==null){
    if(wasNew)Object.assign(s,fsInit(r));
    else if(st.status==='review'){s.stab=Math.max(1,st.interval||1);s.diff=clD(5+(2.5-(st.ease||2.5))*4);s.lastRev=st.lastRev||addDays(day,-(st.interval||1))}
    else Object.assign(s,fsInit(3));
  }
  const grad=iv=>{iv=Math.min(o.maxIv,Math.max(1,Math.round(iv)));s.status='review';s.step=0;s.relearn=false;s.interval=iv;s.due=addDays(day,iv);s.lastRev=now};
  if(st.status!=='review'){
    const relearn=!!st.relearn&&!wasNew,list=relearn?rs:steps,step=wasNew?0:(st.step||0);
    const gradIv=kind=>{
      if(relearn)return kind==='easy'?(st.interval||1)+1:(st.interval||1);
      const base=fs?fsI(s.stab,o.retention):o.grad;
      return kind==='easy'?(fs?Math.max(base+1,Math.round(base*1.3)):o.easyIv):base};
    const learnTo=(min,stp)=>{s.status='learning';s.relearn=relearn;s.step=stp;s.due=now+min*60000};
    if(r===1){if(list.length)learnTo(list[0],0);else grad(gradIv('good'))}
    else if(r===2){if(list.length)learnTo(step===0&&list.length>1?(list[0]+list[1])/2:list[Math.min(step,list.length-1)],step);else grad(gradIv('good'))}
    else if(r===3){if(step+1<list.length)learnTo(list[step+1],step+1);else grad(gradIv('good'))}
    else grad(gradIv('easy'));
  }else{
    const iv=Math.max(1,st.interval||1),ease=st.ease||2.5;
    const elapsed=Math.max(0,(now-(s.lastRev||addDays(day,-iv)))/DAY);
    if(r===1){
      s.lapses=(st.lapses||0)+1;meta.lapse=true;s.ease=Math.max(1.3,ease-.2);
      let niv;if(fs){Object.assign(s,fsNext(s.stab,s.diff,1,elapsed));niv=fsI(s.stab,o.retention)}else niv=Math.max(1,Math.round(iv*o.lapseMult));

      if(rs.length){s.status='learning';s.relearn=true;s.step=0;s.due=now+rs[0]*60000}
      else{s.status='review';s.due=addDays(day,s.interval)}
    }else{

      if(fs){const f2=g=>fsNext(s.stab,s.diff,g,elapsed),h=f2(2),g3=f2(3),e=f2(4);
        hIv=fsI(h.stab,o.retention);gIv=Math.max(hIv+1,fsI(g3.stab,o.retention));eIv=Math.max(gIv+1,fsI(e.stab,o.retention));
        ns=r===2?h:r===3?g3:e}
      else{hIv=Math.max(1,Math.round(iv*o.hard*o.ivMod));gIv=Math.max(hIv+1,Math.round(iv*ease*o.ivMod));eIv=Math.max(gIv+1,Math.round(iv*ease*o.easyBonus*o.ivMod));
        if(r===2)s.ease=Math.max(1.3,ease-.15);else if(r===4)s.ease=ease+.15}
      if(ns){s.stab=ns.stab;s.diff=ns.diff}
      grad(r===2?hIv:r===3?gIv:eIv);
    }
  }
  if(cap&&s.status==='review'&&s.due>cap)s.due=cap;
  return {s,meta};
}

  while((m=re.exec(src))){if(m[1]!==undefined)toks.push({c:m[1]});else if(m[2]===undefined)toks.push({ch:m[3]})}
  let p=0;
  const isCh=(tk,c)=>tk&&tk.ch===c, isC=(tk,c)=>tk&&tk.c===c;
  function seq(stop){let o='';while(p<toks.length&&!stop(toks[p]))o+=script(atom());return o}
  function group(){const tk=toks[p];if(!tk)return '<mrow/>';if(isCh(tk,'{')){p++;const r=seq(x=>isCh(x,'}'));p++;return `<mrow>${r}</mrow>`}return atom().html}
  function rawGroup(){ // Text bis zur schließenden Klammer
    let s='';if(isCh(toks[p],'{')){p++;let d=1;while(p<toks.length){const tk=toks[p++];if(tk.ch==='{')d++;else if(tk.ch==='}'){if(--d===0)break}else s+=tk.ch!==undefined?tk.ch:(tk.c.length===1&&!/[a-zA-Z]/.test(tk.c)?tk.c:' '+tk.c)}}return s}
  function script(base){
    let sup=null,sub=null;
    while(toks[p]&&(isCh(toks[p],'^')||isCh(toks[p],'_'))){const up=toks[p].ch==='^';p++;const g=group();if(up)sup=g;else sub=g}
    if(sup===null&&sub===null)return base.html;
    const tag=base.limits?(sup!==null&&sub!==null?'munderover':sup!==null?'mover':'munder'):(sup!==null&&sub!==null?'msubsup':sup!==null?'msup':'msub');
    return `<${tag}>${base.html}${sub!==null?sub:''}${sup!==null?sup:''}</${tag}>`;
  }
  const A=(html,limits)=>({html,limits});
  function atom(){
    const tk=toks[p++];
    if(tk.ch!==undefined){
      const ch=tk.ch;
      if(ch==='{'){const r=seq(x=>isCh(x,'}'));p++;return A(`<mrow>${r}</mrow>`)}
      if(/[0-9]/.test(ch)){let n=ch;while(toks[p]&&toks[p].ch!==undefined&&/[0-9.]/.test(toks[p].ch)&&!(toks[p].ch==='.'&&!(toks[p+1]&&/[0-9]/.test(toks[p+1].ch||''))))n+=toks[p++].ch;return A(`<mn>${n}</mn>`)}
      if(/\p{L}/u.test(ch))return A(`<mi>${mx(ch)}</mi>`);
      const map={'-':'−','*':'∗',"'":'′'};return A(`<mo>${mx(map[ch]||ch)}</mo>`);
    }
    const c=tk.c;
    if(c in TEX_SYM)return A(`<mi>${TEX_SYM[c]}</mi>`);
    if(c in TEX_BIG)return A(`<mo largeop="true">${TEX_BIG[c]}</mo>`,c!=='int');
    if(c in TEX_OP)return A(`<mo>${TEX_OP[c]}</mo>`);
    if(c in TEX_SP)return A(`<mspace width="${c==='!'?'0':c===','||c===';'||c===':'||c===' '?'0.25em':c==='quad'?'1em':'2em'}"/>`);
    if(TEX_FN.has(c))return A(`<mi mathvariant="normal">${c}</mi>`,c==='lim'||c==='max'||c==='min'||c==='sup'||c==='inf');
    switch(c){
      case 'frac':case 'dfrac':case 'tfrac':{const a=group(),b=group();return A(`<mfrac>${a}${b}</mfrac>`)}
      case 'binom':{const a=group(),b=group();return A(`<mrow><mo>(</mo><mfrac linethickness="0">${a}${b}</mfrac><mo>)</mo></mrow>`)}
      case 'sqrt':{let idx=null;if(isCh(toks[p],'[')){p++;idx=seq(x=>isCh(x,']'));p++}const g=group();return A(idx!==null?`<mroot>${g}<mrow>${idx}</mrow></mroot>`:`<msqrt>${g}</msqrt>`)}
      case 'text':case 'textbf':case 'textit':case 'mathrm':case 'mathbf':case 'mathit':case 'mathsf':case 'mathtt':case 'operatorname':case 'rm':{
        const s=rawGroup();const v=c==='mathbf'||c==='textbf'?' mathvariant="bold"':c==='mathit'||c==='textit'?' mathvariant="italic"':'';
        return A(c==='mathrm'||c==='operatorname'?`<mi mathvariant="normal">${mx(s)}</mi>`:`<mtext${v}>${mx(s).replace(/ /g,'\u00a0')}</mtext>`)}
      case 'mathbb':{const s=rawGroup();return A(`<mi>${[...s].map(x=>TEX_BB[x]||x).join('')}</mi>`)}
      case 'mathcal':case 'mathscr':{const s=rawGroup();return A(`<mi mathvariant="script">${mx(s)}</mi>`)}
      case 'overline':case 'bar':{const g=group();return A(`<mover accent="true">${g}<mo>‾</mo></mover>`)}
      case 'underline':{const g=group();return A(`<munder>${g}<mo>_</mo></munder>`)}
      case 'hat':{const g=group();return A(`<mover accent="true">${g}<mo>^</mo></mover>`)}
      case 'vec':{const g=group();return A(`<mover accent="true">${g}<mo>→</mo></mover>`)}
      case 'tilde':{const g=group();return A(`<mover accent="true">${g}<mo>~</mo></mover>`)}
      case 'pmod':{const g=group();return A(`<mrow><mspace width="0.5em"/><mo>(</mo><mi mathvariant="normal">mod</mi><mspace width="0.25em"/>${g}<mo>)</mo></mrow>`)}
      case 'bmod':return A(`<mi mathvariant="normal">mod</mi>`);
      case 'left':{const d=toks[p++],o=d.ch!==undefined?d.ch:(TEX_OP[d.c]||d.c);const r=seq(x=>isC(x,'right'));p++;const e=toks[p++]||{ch:''},cl=e.ch!==undefined?e.ch:(TEX_OP[e.c]||e.c);
        const f=x=>x==='.'?'':x;return A(`<mrow><mo>${mx(f(o))}</mo>${r}<mo>${mx(f(cl))}</mo></mrow>`)}
      case 'right':return A('');
      case 'begin':{const env=rawGroup(),rows=[[[]]];let cur='';
        const end=x=>isC(x,'end');const rowsOut=[];let cells=[];
        while(p<toks.length&&!end(toks[p])){
          cur=seq(x=>end(x)||isCh(x,'&')||isC(x,'\\'));
          cells.push(`<mtd>${cur}</mtd>`);
          if(isCh(toks[p],'&'))p++;else if(isC(toks[p],'\\')){p++;rowsOut.push(cells);cells=[]}
        }
        if(cells.length)rowsOut.push(cells);p++;rawGroup();
        const body=`<mtable>${rowsOut.map(r=>`<mtr>${r.join('')}</mtr>`).join('')}</mtable>`;
        const br={pmatrix:['(',')'],bmatrix:['[',']'],vmatrix:['|','|'],Bmatrix:['{','}'],cases:['{','']}[env];
        return A(br?`<mrow><mo>${br[0]}</mo>${body}${br[1]?`<mo>${br[1]}</mo>`:''}</mrow>`:body)}
      case 'end':return A('');
      case '\\':return A('<mspace linebreak="newline"/>');
      default:return A(`<mtext>${mx('\\'+c)}</mtext>`);
    }
  }
  const body=seq(()=>false);
  return `<math xmlns="http://www.w3.org/1998/Math/MathML" display="${display?'block':'inline'}"><mrow>${body}</mrow></math>`;
}
function texHTML(src,display){
  try{return `<span class="tex${display?' d':''}">${texToMathML(unesc(src).trim(),display)}</span>`}catch(e){return `<code>${esc(unesc(src))}</code>`}
}

function fmtInline(s){
  const st=[];const keep=h=>'\u0002'+(st.push(h)-1)+'\u0003';
  s=String(s);
  s=s.replace(/```([\w+#-]*)\n?([\s\S]*?)```/g,(m,l,code)=>keep(`<pre class="code">${hlCode(unesc(code.replace(/\n$/,'')))}</pre>`));
  s=s.replace(/`([^`\n]+)`/g,(m,c)=>keep(`<code>${c}</code>`));
  s=s.replace(/\$\$([\s\S]+?)\$\$/g,(m,x)=>keep(texHTML(x,true)));
  s=s.replace(/\\\[([\s\S]+?)\\\]/g,(m,x)=>keep(texHTML(x,true)));
  s=s.replace(/\\\((.+?)\\\)/g,(m,x)=>keep(texHTML(x,false)));
  s=s.replace(/\$(?![\s$])((?:[^$\n\\]|\\.)+?)\$(?!\d)/g,(m,x)=>/\s$/.test(x)?m:keep(texHTML(x,false)));
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*\w])\*(?![\s*])(.+?)\*(?![\w*])/g,(m,pre,x)=>/[\s*]$/.test(x)?m:pre+'<i>'+x+'</i>');
  s=s.replace(/^#{1,3} (.+)$/gm,'<b>$1</b>').replace(/^[-*] (?=\S)/gm,'• ');
  return s.replace(/\u0002(\d+)\u0003/g,(m,i)=>st[+i]);
}
const fmtText=s=>fmtInline(esc(s));

/* ================= Rechenaufgaben (sichere Ausdrücke mit BigInt) ================= */
const bmod=(a,m)=>{if(m===0n)throw new Error('mod 0');const r=a%m;return r<0n?r+m:r};
const bgcd=(a,b)=>{a=a<0n?-a:a;b=b<0n?-b:b;while(b){[a,b]=[b,a%b]}return a};
function bmodinv(a,m){let [r0,r1]=[bmod(a,m),m],[s0,s1]=[1n,0n];while(r1){const q=r0/r1;[r0,r1]=[r1,r0-q*r1];[s0,s1]=[s1,s0-q*s1]}if(r0!==1n)throw new Error('modinv: keine Inverse');return bmod(s0,m)}
function bisprime(n){if(n<2n)return false;for(let i=2n;i*i<=n;i++)if(n%i===0n)return false;return true}
const CALC_FN={
  modpow:(a,b,m)=>{if(b<0n)throw new Error('modpow: Exponent < 0');let r=1n;a=bmod(a,m);while(b>0n){if(b&1n)r=r*a%m;a=a*a%m;b>>=1n}return bmod(r,m)},
  modinv:bmodinv,gcd:bgcd,lcm:(a,b)=>a/bgcd(a,b)*b,mod:bmod,abs:a=>a<0n?-a:a,min:(a,b)=>a<b?a:b,max:(a,b)=>a>b?a:b,xor:(a,b)=>a^b,
  isprime:a=>bisprime(a)?1n:0n,
  phi:n=>{if(n>10n**9n)throw new Error('phi: Zahl zu groß');let r=n,x=n;for(let p=2n;p*p<=x;p++)if(x%p===0n){while(x%p===0n)x/=p;r-=r/p}if(x>1n)r-=r/x;return r}
};
function evalExpr(src,vars){
  const toks=[],re=/\s*(?:(\d+)|([A-Za-z_]\w*)|(.))/gy;let m;
  while(re.lastIndex<src.length&&(m=re.exec(src))){if(m[1]!==undefined)toks.push({n:BigInt(m[1])});else if(m[2]!==undefined)toks.push({id:m[2]});else if(m[3])toks.push({op:m[3]})}
  if(toks.length>400)throw new Error('Ausdruck zu lang');
  let p=0;const peek=()=>toks[p],op=o=>toks[p]&&toks[p].op===o;
  function prim(){
    const tk=toks[p++];if(!tk)throw new Error('Ausdruck unvollständig');
    if(tk.n!==undefined)return tk.n;
    if(tk.id){
      if(op('(')){p++;const args=[];if(!op(')')){do{args.push(add())}while(op(',')&&p++)}if(!op(')'))throw new Error(') fehlt');p++;
        const f=CALC_FN[tk.id];if(!f)throw new Error('Unbekannte Funktion '+tk.id);return f(...args)}
      if(vars&&vars[tk.id]!==undefined)return vars[tk.id];throw new Error('Unbekannte Variable '+tk.id)}
    if(tk.op==='('){const v=add();if(!op(')'))throw new Error(') fehlt');p++;return v}
    if(tk.op==='-')return -pow();if(tk.op==='+')return pow();
    throw new Error('Unerwartet: '+(tk.op||tk.id));
  }
  function pow(){const b=prim();if(op('^')){p++;const e=pow();if(e<0n||e>5000n)throw new Error('Exponent außerhalb 0..5000');if(b**e>(10n**400n)&&false)return 0n;return b**e}return b}
  function mul(){let v=pow();while(op('*')||op('/')||op('%')){const o=toks[p++].op,r=pow();if(o==='*')v*=r;else if(o==='/'){if(r===0n)throw new Error('Division durch 0');v/=r}else v=bmod(v,r)}return v}
  function add(){let v=mul();while(op('+')||op('-')){const o=toks[p++].op,r=mul();v=o==='+'?v+r:v-r}return v}
  const v=add();if(p<toks.length)throw new Error('Unerwartet: '+(toks[p].op||toks[p].id));return v;
}
const calcRand=(lo,hi)=>lo+BigInt(Math.floor(Math.random()*(Number(hi-lo)+1)));
function calcVars(spec){
  const vars={},primeVals=[];
  for(let line of String(spec||'').split('\n')){
    line=line.trim();if(!line||line.startsWith('#'))continue;
    const m=/^(\w+)\s*=\s*(prime\s+)?(-?\d+)\s*\.\.\s*(-?\d+)$/.exec(line);
    if(m){let lo=BigInt(m[3]),hi=BigInt(m[4]);if(hi<lo)[lo,hi]=[hi,lo];
      if(m[2]){const ps=[];for(let x=lo;x<=hi&&ps.length<5000;x++)if(bisprime(x))ps.push(x);if(!ps.length)throw new Error('Keine Primzahl in '+m[3]+'..'+m[4]);
        let v;for(let k=0;k<30;k++){v=ps[Math.floor(Math.random()*ps.length)];if(!primeVals.includes(v)||ps.length<2)break}primeVals.push(v);vars[m[1]]=v}
      else vars[m[1]]=calcRand(lo,hi);continue}
    const m2=/^(\w+)\s*=\s*(.+)$/.exec(line);if(!m2)throw new Error('Ungültige Zeile: '+line);vars[m2[1]]=evalExpr(m2[2],vars);

function calcSub(text,vars){
  return String(text||'').replace(/\{(=)?\s*([^{}]+?)\s*\}/g,(m,eq,x)=>{
    if(eq){try{return String(evalExpr(x,vars))}catch{return m}}
    return vars[x]!==undefined?String(vars[x]):m});
}
function calcInstance(c){
  const f=c.fields||{};let err;
  for(let i=0;i<25;i++){ // manche Zufallswerte sind unlösbar (z. B. modinv ohne Inverse) → neu würfeln
    try{const vars=calcVars(f.vars),ans=evalExpr(String(f.answer||'0'),vars).toString();return {vars,q:calcSub(f.front,vars),ans}}catch(e){err=e}
  }

function planReplace(cards,o){

    const f=c.fields||{},nf={...f},keys=o.field==='all'?Object.keys(f):[o.field];let ch=false;

  return `<div class="fc" tabindex="0" role="img" aria-label="${esc(labels.map((l,i)=>l+': '+vals[i]).join(', '))}">${vals.map((v,i)=>`<div title="${esc(labels[i])}: ${v}"><div class="small">${v||''}</div><div class="bar"><i style="height:${v?Math.max(3,Math.round(v/mx*h)):0}px;opacity:${i===0?1:.75}"></i></div><div class="mut" style="font-size:11px">${esc(labels[i])}</div></div>`).join('')}</div>`;
}
const dd=str=>{const ts=parseD(str);return ts?dayDiff(ts,dayStart()):null};
function deckDatesHTML(d,c){
  const out=[],e=dd(d.exam),f=dd(d.due),rel=n=>n===0?t('heute'):n===1?t('morgen'):t('in {0} T',n);
  if(e!==null)out.push(e<0?`<span class="mut">${t('Prüfung war am {0}',fmtDate(parseD(d.exam)))}</span>`:`📝 ${t('Prüfung {0}',rel(e))} <span class="mut">(${fmtDate(parseD(d.exam))})</span>`);
  if(f!==null)out.push(f<0?`<span style="color:var(--bad)">⏰ ${t('Frist überschritten ({0})',fmtDate(parseD(d.due)))}</span>`:`⏰ ${t('Frist {0}',rel(f))} <span class="mut">(${fmtDate(parseD(d.due))})</span>`);
  const tg=[e,f].filter(x=>x!==null&&x>=0).sort((a,b)=>a-b)[0];
  if(tg!==undefined&&c.rawNew>0){const need=Math.ceil(c.rawNew/Math.max(1,tg)),lim=optFor(d.id).newPerDay,low=need>lim;
    out.push(`<span style="color:${low?'var(--warn)':'var(--mut)'}">${t('Plan: {0} neue Karten/Tag',need)}${low?t(' (Limit {0} ist zu niedrig)',lim):''}</span>`)}
  return out.join('<br>')||'<span class="mut">–</span>';
}
function forecastData(deckIds,N){
  const b=new Array(N+1).fill(0),t0=dayStart();let later=0,tot=0;
  for(const c of S.cards.values()){
    if(deckIds&&!deckIds.has(c.deck))continue;if(c.susp)continue;
    const s=S.states.get(c.id);if(!s||s.status==='new')continue;
    const i=Math.max(0,dayDiff(dayStart(s.due),t0));if(i>N)later++;else b[i]++;tot++;
  }
  const exams=new Set();
  for(const d of S.decks.values()){if(deckIds&&!deckIds.has(d.id))continue;const e=dd(d.exam);if(e!==null&&e>=0&&e<=N)exams.add(e)}
  const labels=b.map((_,i)=>(exams.has(i)?'📝 ':'')+(i===0?t('Heute'):i===1?t('Morgen'):new Date(addDays(t0,i)).toLocaleDateString(LOC(),{weekday:'short',day:'numeric',month:'numeric'})));
  return {b,labels,later,tot};
}

function computeStats(){
  const intro=introducedByDeck(),rev=reviewsByDeck(),now=Date.now(),own=new Map();
  for(const d of S.decks.values())own.set(d.id,{n:0,l:0,d:0,total:0,susp:0});
  for(const c of S.cards.values()){
    const r=own.get(c.deck);if(!r)continue;r.total++;
    if(c.susp){r.susp++;continue}if((c.buryUntil||0)>now)continue;
    const s=S.states.get(c.id);if(!s)continue;
    if(s.status==='new')r.n++;else if(s.status==='learning'){if(s.due<=now)r.l++}else if(s.due<=now)r.d++;
  }
  const tot=new Map(),byName=new Map([...S.decks.values()].map(d=>[norm(d.name),d.id])),grand={new:0,learn:0,due:0,total:0};
  const zero=()=>({new:0,learn:0,due:0,total:0,susp:0,rawDue:0,rawNew:0});
  for(const d of S.decks.values()){
    const o=optFor(d.id),r=own.get(d.id);
    const v={new:Math.min(r.n,Math.max(0,o.newPerDay-(intro.get(d.id)||0))),learn:r.l,due:Math.min(r.d,Math.max(0,o.revPerDay-(rev.get(d.id)||0))),total:r.total,susp:r.susp,rawDue:r.d,rawNew:r.n};
    grand.new+=v.new;grand.learn+=v.learn;grand.due+=v.due;grand.total+=v.total;
    const parts=norm(d.name).split('::');
    for(let i=1;i<=parts.length;i++){const id=byName.get(parts.slice(0,i).join('::'));if(!id)continue;let a=tot.get(id);if(!a)tot.set(id,a=zero());for(const k in a)a[k]+=v[k]}
  }
  return {tot,grand};
}

async function renameDeck(id,newName){
  const d=S.decks.get(id),old=d.name,np=deckPath({name:newName}).join('::');
  if(deckByName(np)&&deckByName(np).id!==id){toast(t('Name existiert bereits'));return}
  const puts=[];
  for(const x of S.decks.values()){const n=x.name;if(norm(n)===norm(old))puts.push({...x,name:np});else if(norm(n).startsWith(norm(old)+'::'))puts.push({...x,name:np+n.slice(old.length)})}
  await commit({decks:puts});
  const parents=np.split('::').slice(0,-1);if(parents.length)await ensureDeck(parents.join('::'));
}

async function fillAtts(el,card,side){
  for(const a of card.atts||[]){
    let sd=a.side||'back';if(card.type==='reversed'&&card.ord===1)sd=sd==='front'?'back':'front';
    if(sd!==side)continue;if(card.type==='occlusion'&&(a.name===card.fields?.image||(!card.fields?.image&&(a.type||'').startsWith('image/'))))continue;

async function commitStudy(puts,entry=null,removeId=null){
  const names=[...new Set(['log',...Object.keys(puts)])];let logId;
  await DB.tx(names,tr=>{
    for(const [name,items] of Object.entries(puts))for(const item of items)tr.objectStore(name).put(item);
    if(entry){const req=tr.objectStore('log').add(entry);req.onsuccess=()=>{logId=req.result}}
    if(removeId!=null)tr.objectStore('log').delete(removeId);
  });
  applyCommitted(puts,{},names);
  if(removeId!=null)S.log=S.log.filter(e=>e.id!==removeId);
  if(entry){entry.id=logId;S.log.push(entry)}
  refreshToday();
}

function buildQueue(deckId,dueOnly){
  const now=Date.now(),ids=deckId?new Set(deckIdsUnder(deckId)):null,intro=introducedByDeck(),rev=reviewsByDeck();
  const lrn=[],due=[],nw=[];
  for(const c of S.cards.values()){
    if(ids&&!ids.has(c.deck))continue;if(c.susp||(c.buryUntil||0)>now)continue;
    const s=S.states.get(c.id);if(!s)continue;
    if(s.status==='new')nw.push(c);else if(s.status==='learning'){if(s.due<=now)lrn.push([s.due,c.id])}else if(s.due<=now)due.push([s.due,c]);
  }
  lrn.sort((a,b)=>a[0]-b[0]);due.sort((a,b)=>a[0]-b[0]);nw.sort((a,b)=>a.created-b.created||a.ord-b.ord);
  const out=lrn.map(x=>x[1]),revLeft=new Map(),newLeft=new Map();
  for(const [,c] of due){const o=optFor(c.deck);if(!revLeft.has(c.deck))revLeft.set(c.deck,Math.max(0,o.revPerDay-(rev.get(c.deck)||0)));if(revLeft.get(c.deck)>0){revLeft.set(c.deck,revLeft.get(c.deck)-1);out.push(c.id)}}
  if(!dueOnly)for(const c of nw){const o=optFor(c.deck);if(!newLeft.has(c.deck))newLeft.set(c.deck,Math.max(0,o.newPerDay-(intro.get(c.deck)||0)));if(newLeft.get(c.deck)>0){newLeft.set(c.deck,newLeft.get(c.deck)-1);out.push(c.id)}}
  // Prüfungsmodus: schwache Karten vor dem Termin zusätzlich einplanen
  const day0=dayStart(),seen=new Set(S.logToday.map(e=>e.card)),usedExtra=new Map(),cand=new Map();
  for(const e of S.logToday)if(e.exam)usedExtra.set(e.deck,(usedExtra.get(e.deck)||0)+1);
  for(const c of S.cards.values()){
    if(ids&&!ids.has(c.deck))continue;if(c.susp||(c.buryUntil||0)>now||seen.has(c.id))continue;
    const dk=S.decks.get(c.deck);if(!dk||!dk.exam)continue;const o=optFor(c.deck);if(!(+o.examExtra>0))continue;
    const ex=parseD(dk.exam),left=dayDiff(ex,day0);if(left<0||left>(+o.examDays||21))continue;
    const s=S.states.get(c.id);if(!s||s.status!=='review'||s.due<=now)continue;
    const weak=(s.lapses||0)>=2||s.ease<2.1||s.due>ex;if(!weak)continue;
    const score=(s.lapses||0)*2+(2.5-s.ease)*3+(s.due>ex?2:0)+(left<=3?1:0);
    let a=cand.get(c.deck);if(!a)cand.set(c.deck,a=[]);a.push([score,c.id]);
  }
  for(const [dk,a] of cand){const o=optFor(dk),left=Math.max(0,(+o.examExtra)-(usedExtra.get(dk)||0));a.sort((x,y)=>y[0]-x[0]);a.slice(0,left).forEach(x=>out.push(x[1]))}
  return out;
}

function sortedDecks(){
  const by=new Map([...S.decks.values()].map(d=>[norm(d.name),d]));
  const key=d=>{const parts=deckPath(d),out=[];for(let i=1;i<=parts.length;i++){const a=by.get(norm(parts.slice(0,i).join('::')));out.push([a&&a.pos!=null?a.pos:1e9,parts[i-1].toLowerCase()])}return out};
  const ks=new Map([...S.decks.values()].map(d=>[d.id,key(d)]));
  return [...S.decks.values()].sort((a,b)=>{const x=ks.get(a.id),y=ks.get(b.id);
    for(let i=0;i<Math.min(x.length,y.length);i++){if(x[i][0]!==y[i][0])return x[i][0]-y[i][0];const c=x[i][1].localeCompare(y[i][1],'de');if(c)return c}return x.length-y.length});
}
const lastPart=n=>deckPath({name:n}).pop();

function filteredCards(){
  const key=[S.rev,MF.q,MF.deck,MF.status,MF.tag,MF.sort,Math.floor(Date.now()/60000)].join('\u0001');
  if(_fc.key===key&&_fc.list)return _fc.list;
  const pred=compileSearch(MF.q),ids=MF.deck?new Set(deckIdsUnder(MF.deck)):null,now=Date.now(),out=[];
  for(const c of S.cards.values()){

    switch(MF.status){

    if(MF.tag&&!(c.tags||[]).includes(MF.tag))continue;

/* ================= Lernplan bis zum Prüfungstermin ================= */
function cardReadiness(c,exTs){ // grobe Schätzung der Behaltenswahrscheinlichkeit am Prüfungstag, wenn bis dahin alle fälligen Karten wiederholt werden
  const s=S.states.get(c.id);if(!s||s.status==='new')return 0;
  if(s.status==='learning')return .3;
  const last=s.lastRev||s.last||(s.due-Math.max(1,s.interval||1)*DAY),dt=Math.max(0,(exTs-last)/DAY);
  let r;
  if(s.stab&&s.stab>0)r=fsR(dt,s.stab);else r=Math.pow(.9,dt/Math.max(1,s.interval||1));
  if(s.due<=exTs)r=Math.max(r,.9); // wird vor der Prüfung noch einmal fällig
  return Math.min(.99,r*Math.pow(.97,Math.min(5,s.lapses||0)));
}
function planData(deckId){
  const d=S.decks.get(deckId);if(!d||!d.exam)return null;
  const ex=parseD(d.exam),today=dayStart(),days=Math.round((ex-today)/DAY);
  const ids=new Set(deckIdsUnder(deckId)),cards=[...S.cards.values()].filter(c=>ids.has(c.deck)&&!c.susp);
  const buf=Math.max(0,Math.min(Math.max(0,days-1),S.settings.planBuf??7));
  const stOf=c=>S.states.get(c.id)||newState(c.id);
  const newRem=cards.filter(c=>stOf(c).status==='new').length,window=Math.max(1,days-buf),need=Math.ceil(newRem/window),limit=optFor(deckId).newPerDay;
  const due7=cards.filter(c=>{const s=stOf(c);return s.status!=='new'&&s.due<=addDays(today,7)}).length;
  const avg=a=>a.length?a.reduce((x,c)=>x+cardReadiness(c,ex),0)/a.length:0;
  const base=norm(d.name),depth=deckPath(d).length,groups=new Map();
  for(const c of cards){const dk=S.decks.get(c.deck),p=deckPath(dk);const key=p.length>depth?p.slice(0,depth+1).join('::'):'';(groups.get(key)||groups.set(key,[]).get(key)).push(c)}
  let topics=[...groups].map(([key,cs])=>({key,label:key?key.split('::').pop():t('(direkt in diesem Stapel)'),deck:key?(deckByName(key)||{}).id||null:deckId,n:cs.length,nw:cs.filter(c=>stOf(c).status==='new').length,
    ready:avg(cs),weak:cs.filter(c=>{const s=stOf(c);return s.status!=='new'&&((s.lapses||0)>=3||(s.ease||2.5)<2)}).length}));
  if(topics.length<2){ // keine Unterstapel → nach Tags aufteilen
    const tg=new Map();for(const c of cards){for(const x of (c.tags||[]).slice(0,1)){(tg.get(x)||tg.set(x,[]).get(x)).push(c)}}
    if(tg.size>1)topics=[...tg].map(([key,cs])=>({key,label:'#'+key,tag:key,deck:deckId,n:cs.length,nw:cs.filter(c=>stOf(c).status==='new').length,ready:avg(cs),weak:cs.filter(c=>{const s=stOf(c);return s.status!=='new'&&((s.lapses||0)>=3||(s.ease||2.5)<2)}).length}));
  }
  topics.sort((a,b)=>a.ready-b.ready);
  return {d,ex,days,cards:cards.length,newRem,buf,window,need,limit,due7,ready:avg(cards),topics,
    finishDate:limit>0?addDays(today,Math.ceil(newRem/limit)):null};
}

  if(!items.length)return '';

/* ---------- Mehrere Karten aus einer Tabelle (Excel/Calc) einfügen ---------- */
function parseTable(txt){
  txt=String(txt).replace(/\r\n?/g,'\n').replace(/ /g,' ');
  const first=txt.split('\n',1)[0],dl=first.includes('\t')?'\t':(first.includes(';')&&!first.includes('\t')?';':'\t');
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"'&&cell==='')q=true;
    else if(c===dl){row.push(cell);cell=''}
    else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=c}
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(x=>x));
}

/* ---------- Parser ---------- */
function parseCSV(text){
  let s=text.replace(/^﻿/,'');
  while(s.startsWith('#')){const i=s.indexOf('\n');s=i<0?'':s.slice(i+1)}
  const fl=s.split('\n')[0]||'',cnt={'\t':(fl.match(/\t/g)||[]).length,';':(fl.match(/;/g)||[]).length,',':(fl.match(/,/g)||[]).length};
  const d=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<s.length;i++){const ch=s[i];
    if(q){if(ch==='"'){if(s[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"'&&cur==='')q=true;
    else if(ch===d){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&s[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x!==''))rows.push(row);row=[]}
    else cur+=ch}
  row.push(cur);if(row.some(x=>x!==''))rows.push(row);
  return rows;
}
function cleanField(s,imgs){
  if(!/<(br|img|div|p|span|b|i|u|a|font|sub|sup)\b|\[sound:/i.test(s))return s.trim();
  s=s.replace(/<img[^>]*src=["']([^"']+)["'][^>]*>/gi,(m,src)=>{try{imgs.push(decodeURIComponent(src.split('/').pop()))}catch{imgs.push(src.split('/').pop())}return''});
  s=s.replace(/\[sound:([^\]]+)\]/g,(m,n)=>{imgs.push(n);return''});
  s=s.replace(/<br\s*\/?>/gi,'\n').replace(/<\/(div|p)>/gi,'\n').replace(/<[^>]+>/g,'');
  const ta=document.createElement('textarea');ta.innerHTML=s;return ta.value.trim();
}

    if(g.status&&g.status!=='new'){const due=Date.parse(g.due);n.states={0:{...newState('x'),status:g.status,interval:+g.interval||0,ease:+g.ease||2.5,reps:+g.reps||0,lapses:+g.lapses||0,due:isNaN(due)?Date.now():due}}}

function jsonToParsed(j,pool){
  if(Array.isArray(j))j={notes:j};
  const P={package:j.package||null,models:j.models||[],origin:j.origin||null,partial:!!j.partial,notes:[],decks:j.decks||[],log:j.log||null,settings:j.settings||null};
  const attOf=a=>{const o={name:String(a.name||'').split(/[\\/]/).pop(),type:a.type||guessType(a.name||''),size:a.size,side:a.side||'back',id:a.id,osize:a.osize};
    if(a.data){o.data=a.data;o.size=o.size||Math.floor(a.data.length*3/4)}else{const f=(a.file&&pool.get(norm(a.file)))||pool.get(norm(a.name));if(f){o.blob=f;o.size=o.size||f.size}}return o};
  if(Array.isArray(j))j={notes:j};
  if(j.version>=2||j.notes||(Array.isArray(j.cards)&&j.cards.some(c=>c&&(c.fields||c.type)))){
    for(const n of j.notes||j.cards||[])P.notes.push({...n,deck:n.deck||'Importiert',fields:(n.fields&&typeof n.fields==='object')?n.fields:undefined,tags:n.tags||[],aliases:n.aliases||[],atts:(n.atts||[]).map(attOf)});
  }else{ // v1: Karten mit front/back
    const st=new Map((j.states||[]).map(s=>[s.id,s]));
    for(const c of j.cards||[])P.notes.push({id:c.id,type:'basic',deck:c.deck||'Importiert',fields:{front:c.front||'',back:c.back||''},tags:c.tags||[],aliases:[],
      atts:(c.attachments||[]).map(attOf),created:c.created,updated:c.updated,states:st.has(c.id)?{0:st.get(c.id)}:undefined});
  }
  return P;
}
async function parseFiles(files){
  const pool=new Map(),data=[];
  for(const f of files){
    if(/\.zip$/i.test(f.name)){
      let es;try{es=await readZip(f)}catch(e){toast(t('ZIP ungültig oder zu groß: {0}',f.name));continue}
      for(const e of es){const base=e.name.split('/').pop(),ff=new File([e.blob],base,{type:guessType(base)});
        if(/\.(json|csv|tsv|txt)$/i.test(base)&&!/^media\//i.test(e.name))data.push(ff);else{pool.set(norm(e.name),ff);if(!pool.has(norm(base)))pool.set(norm(base),ff)}}
    }else if(/\.(json|csv|tsv|txt)$/i.test(f.name))data.push(f);else pool.set(norm(f.name),f)}
  const P={package:null,models:[],origin:null,partial:true,notes:[],decks:[],log:null,settings:null};
  for(const f of data){
    if(f.size>400e6){toast(t('Datei zu groß: {0}',f.name));continue}
    const txt=await f.text();
    if(/\.json$/i.test(f.name)){let j;try{j=JSON.parse(txt);j=await maybeDecrypt(j)}catch{toast(t('Ungültige JSON-Datei: {0}',f.name));continue}
      if(!j||typeof j!=='object'){toast(t('Ungültige JSON-Datei: {0}',f.name));continue}
      const p=jsonToParsed(j,pool);P.notes.push(...p.notes);P.decks.push(...p.decks);P.models.push(...p.models);P.package=P.package||p.package;P.origin=P.origin||p.origin;P.partial=p.partial&&P.partial;P.log=p.log||P.log;P.settings=p.settings||P.settings;if(!p.partial&&data.length===1)P.partial=false}
    else P.notes.push(...csvToNotes(txt,pool));
  }
  if(!data.length){ // lose Dateien -> je eine Karte
    for(const [,f] of pool){const type=f.type||guessType(f.name);
      P.notes.push({id:'file-'+h53(f.name+f.size).toString(36),type:'basic',deck:'Dateien',fields:{front:f.name.replace(/\.[^.]+$/,''),back:''},tags:[],aliases:[],atts:[{name:f.name,type,size:f.size,side:'back',blob:f}]})}
  }
  return P;
}

/* ---------- Plan / Diff ---------- */
function wdiff(a,b){
  a=String(a||'');b=String(b||'');const x=a.split(/(\s+)/),y=b.split(/(\s+)/);
  if(x.length*y.length>160000)return `<del>${esc(a)}</del> <ins>${esc(b)}</ins>`;
  const L=Array.from({length:x.length+1},()=>new Uint16Array(y.length+1));
  for(let i=x.length-1;i>=0;i--)for(let j=y.length-1;j>=0;j--)L[i][j]=x[i]===y[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  let i=0,j=0,o='';
  while(i<x.length&&j<y.length){if(x[i]===y[j]){o+=esc(x[i]);i++;j++}else if(L[i+1][j]>=L[i][j+1]){o+=`<del>${esc(x[i])}</del>`;i++}else{o+=`<ins>${esc(y[j])}</ins>`;j++}}
  while(i<x.length)o+=`<del>${esc(x[i++])}</del>`;while(j<y.length)o+=`<ins>${esc(y[j++])}</ins>`;
  return o;
}
const keyOf=(deckName,type,fields)=>norm(deckName)+'|'+type+'|'+norm(type==='cloze'?plainCloze(fields.text,-1,true):fields.front);
function planImport(P){
  const rows=[],keyMap=new Map(),seen=new Set();
  for(const [nid,cs] of noteIndex().byNote){const c=cs[0];const p=primaryText(c);if(p)keyMap.set(norm(deckLabel(c.deck))+'|'+c.type+'|'+p,nid)}
  for(const n of P.notes){
    n.fields=normFields(n.type,n.fields);n.inHash=noteHash(n.type,n.fields,n.atts);
    let ex=findNoteId(n.id)||(n.aliases||[]).map(findNoteId).find(Boolean)||keyMap.get(keyOf(n.deck,n.type,n.fields))||null;
    if(ex&&seen.has(ex))ex=null;
    const row={n,ex,status:'new',inc:true,choice:'local'};
    if(ex){seen.add(ex);const c=noteCards(ex)[0],cur=noteHash(c.type,c.fields,c.atts),base=c.srcHash;row.cur=c;
      if(n.inHash===cur){row.status='same';row.inc=true;row.quiet=true}
      else if(base&&n.inHash===base){row.status='same';row.quiet=true;row.inc=false}
      else if(!base||base===cur){row.status='update'}
      else{row.status='conflict';row.choice='local'}}
    rows.push(row);
  }
  const miss=[];
  if(P.origin&&!P.partial){
    const incoming=new Set(P.notes.flatMap(n=>[n.id,...(n.aliases||[])]));
    for(const [nid,cs] of noteIndex().byNote){const c=cs[0];if(c.origin!==P.origin)continue;
      if(!incoming.has(nid)&&!(c.aliases||[]).some(a=>incoming.has(a)))miss.push({nid,c,policy:'keep'})}
  }
  return {rows,miss};
}
function fieldDiffHTML(r){
  const a=r.cur.fields,b=r.n.fields,out=[];
  for(const k of ['front','back','text','options','extra','source']){if((a[k]||'')!==(b[k]||''))out.push(`<div class="diff"><span class="mut">${esc(k)}:</span> ${wdiff(a[k],b[k])}</div>`)}
  if(r.cur.type!==r.n.type)out.push(`<div class="diff"><span class="mut">${t('Typ')}:</span> <del>${typeLabel(r.cur.type)}</del> <ins>${typeLabel(r.n.type)}</ins></div>`);
  if(JSON.stringify(a.masks||[])!==JSON.stringify(b.masks||[]))out.push(`<div class="diff">${t('Masken geändert')}</div>`);
  const an=(r.cur.atts||[]).map(x=>x.name+x.size).sort().join(),bn=(r.n.atts||[]).map(x=>x.name+x.size).sort().join();
  if(an!==bn)out.push(`<div class="diff">📎 <del>${esc((r.cur.atts||[]).map(x=>x.name).join(', ')||'–')}</del> <ins>${esc((r.n.atts||[]).map(x=>x.name).join(', ')||'–')}</ins></div>`);
  return out.join('')||`<div class="mut small">${t('Nur Metadaten')}</div>`;
}

/* ---------- Anwenden ---------- */
async function applyImport(P,plan,o){
  let nNew=0,nUpd=0,nSkip=0,nDel=0,nSusp=0;
  if(S.cards.size&&!o.noSnap)await snapshot(t('Vor Import'));
  const mediaKeys=new Set(await DB.keys('media'));
  const deckCache=new Map();
  const deckId=async name=>{if(!deckCache.has(name))deckCache.set(name,(await ensureDeck(name)).id);return deckCache.get(name)};
  for(const d of P.decks||[]){const dk=await ensureDeck(d.name);
    if(d.due||d.exam||(o.stateMode==='always'&&d.opt)){const nd={...S.decks.get(dk.id)};if(d.due)nd.due=d.due;if(d.exam)nd.exam=d.exam;if(o.stateMode==='always'&&d.opt)nd.opt=d.opt;await commit({decks:[nd]})}}
  const updates=[],mediaPut=[],mediaDel=[],statePuts=[];
  const usedIds=new Set();
  let rowN=0;
  for(const r of plan.rows){
    if(++rowN%150===0){toast(t('Import… {0} / {1}',rowN,plan.rows.length));await sleep0()}
    const n=r.n;
    if(!r.inc){nSkip++;continue}
    if(r.status==='same'&&!r.quiet){nSkip++;continue}
    if(r.status==='conflict'&&r.choice==='local'){ // eigene Version behalten, Quellstand merken
      updates.push({noteId:r.ex,patch:{srcHash:n.inHash,origin:P.origin||r.cur.origin}});nSkip++;continue}
    // Anhänge abgleichen
    const old=r.cur?r.cur.atts||[]:[],atts=[];
    for(const a of n.atts||[]){
      const hit=old.find(x=>x.name===a.name&&((x.osize||x.size)===(a.osize||a.size)||!a.size));
      if(hit){atts.push({...hit,side:a.side||hit.side});continue}
      if(a.id&&!a.blob&&!a.data&&mediaKeys.has(a.id)){atts.push({id:a.id,name:a.name,type:a.type,size:a.size,osize:a.osize,side:a.side||'back'});continue}
      let blob=a.blob||(a.data?b64ToBlob(a.data,a.type):null);delete a.data;
      if(!blob)continue;
      const orig=blob.size;if(o.shrink)blob=await shrinkImage(blob);
      const id=uid();mediaPut.push({id,blob,name:a.name,type:a.type,size:blob.size});atts.push({id,name:a.name,type:a.type,size:blob.size,osize:blob.size!==orig?(a.osize||a.size||orig):undefined,side:a.side||'back'});
      if(mediaPut.length>=40){await commit({media:mediaPut.splice(0)})}   // Medien portionsweise schreiben (Speicher)
    }
    old.forEach(x=>{if(!atts.some(y=>y.id===x.id))mediaDel.push(x.id)});
    if(r.ex){
      const tags=[...new Set([...(r.cur.tags||[]),...(n.tags||[])])];
      const aliases=[...new Set([...(r.cur.aliases||[]),...(n.id!==r.ex?[n.id]:[]),...(n.aliases||[])])].filter(x=>x!==r.ex);
      if(r.status==='same'){updates.push({noteId:r.ex,patch:{srcHash:n.inHash,origin:P.origin||r.cur.origin,aliases}});continue}
      updates.push({noteId:r.ex,patch:{type:n.type,fields:n.fields,tags,atts,srcHash:n.inHash,origin:P.origin||r.cur.origin,aliases}});nUpd++;
      if(o.stateMode==='always'&&n.states)for(const [ord,s] of Object.entries(n.states))statePuts.push({...s,id:cardIdOf(r.ex,+ord)});
    }else{
      let id=n.id&&!findNoteId(n.id)&&!usedIds.has(n.id)?n.id:uid();usedIds.add(id);
      updates.push({noteId:id,create:true,patch:{type:n.type,deck:await deckId(n.deck),fields:n.fields,tags:n.tags||[],atts,srcHash:n.inHash,origin:n.origin||P.origin||undefined,aliases:(n.aliases||[]).filter(x=>x!==id),created:n.created||Date.now(),note:n.note||undefined}});
      nNew++;
      if(o.stateMode!=='never'&&n.states)for(const [ord,s] of Object.entries(n.states))statePuts.push({...s,id:cardIdOf(id,+ord)});
    }
  }
  if(mediaPut.length)await commit({media:mediaPut.splice(0)});
  await applyNoteUpdates(updates);
  if(statePuts.length)await commit({states:statePuts});
  // fehlende Notizen
  const delIds=[],suspC=[];
  for(const m of plan.miss){
    if(m.policy==='delete'){noteCards(m.nid).forEach(c=>delIds.push(c.id));nDel++}
    else if(m.policy==='suspend'){noteCards(m.nid).forEach(c=>suspC.push({...c,susp:true,updated:Date.now()}));nSusp++}
  }
  if(suspC.length)await commit({cards:suspC});
  if(delIds.length)await deleteCards(delIds);
  return {nNew,nUpd,nSkip,nDel,nSusp};
}

async function prepareImport(files,quiet){
  files=[...files];if(!files.length)return null;
  if(files.reduce((a,f)=>a+f.size,0)>1.5e9){if(!quiet)toast(t('Dateien zu groß (max. 1,5 GB).'));return null}
  const P=await parseFiles(files);
  if(!P.notes.length){if(!quiet)toast(t('Keine Karten gefunden.'));return null}
  await mergeModels(P.models);
  const warn=sanitizeParsed(P);
  const plan=planImport(P);
  for(const r of plan.rows)if(r.n._check&&r.n._check.lvl==='error')r.inc=false; // fehlerhafte Karten standardmäßig nicht importieren
  return {P,warn,plan};
}

function fixNote(n,pm){
  if(!n||typeof n!=='object')return false;
  // Felder: fehlen sie, die bekannten Schlüssel der obersten Ebene verwenden
  if(!n.fields||typeof n.fields!=='object'||Array.isArray(n.fields)){
    const f={};for(const k of Object.keys(n)){const a=FIELD_ALIAS[nkey(k)];if(a&&typeof n[k]!=='object')f[a]=n[k]}
    n.fields=f}
  const raw=n.type,k=nkey(raw),note=[];let ty=null;
  const mods=[...(pm||[]),...models()];
  if(typeof raw==='string'&&TYPES.includes(raw))ty=raw;
  else if(typeof raw==='string'&&modelOf(raw))ty=raw;
  else if(k&&TYPE_ALIAS[k])ty=TYPE_ALIAS[k];
  else if(k){const m=mods.find(x=>nkey(x.id)===k||nkey(x.name)===k||('m'+nkey(x.id))===k);if(m)ty='m:'+m.id}
  const had=ty;
  const m0=ty&&modelOf(ty);
  if(!m0){ // Feldnamen auf Standardschlüssel abbilden
    const f={...n.fields};for(const key of Object.keys(n.fields)){const a=FIELD_ALIAS[nkey(key)];if(a&&f[a]===undefined)f[a]=n.fields[key]}n.fields=f}
  const f=n.fields,has=x=>f[x]!==undefined&&String(typeof f[x]==='string'?f[x]:'x').trim()!=='';
  if(!ty){ // aus den Feldern ableiten
    if((has('image')||Array.isArray(f.masks))&&Array.isArray(f.masks)&&f.masks.length)ty='occlusion';
    else if(has('vars')&&has('answer')&&has('front'))ty='calc';
    else if(has('options'))ty='mc';
    else if(has('text')&&!has('front'))ty='cloze';
    else if(has('front')&&/\{\{c\d+::/.test(String(f.front))&&!has('back'))ty='cloze';
    else if(has('front')||has('back'))ty='basic';
    if(ty)note.push(raw?t('Kartentyp „{0}“ nicht bekannt – als „{1}“ erkannt.',String(raw),t(TYPE_LABEL[ty]||ty)):t('Kartentyp fehlte – als „{0}“ erkannt.',t(TYPE_LABEL[ty]||ty)))}

function sanitizeParsed(P){
  const w={blockedAtts:0,skipped:0};
  if(P.notes.length>200000){w.skipped+=P.notes.length-200000;P.notes.length=200000}
  const out=[];
  for(const n of P.notes){
    if(!n||typeof n!=='object'){w.skipped++;continue}
    fixNote(n,P.models);
    if(typeof n.fields!=='object'||!(TYPES.includes(n.type)||modelOf(n.type))){w.skipped++;(w.badTypes=w.badTypes||[]).push(String(n.type??'–'));continue}
    let big=false;for(const k in n.fields){const v=n.fields[k];if(typeof v==='string'&&v.length>100000)big=true;if(k==='masks'&&(!Array.isArray(v)||v.length>200||v.some(m=>!Array.isArray(m)||m.length!==4||m.some(x=>!(x>=0&&x<=1)))))big=true}
    if(big){w.skipped++;continue}
    n.id=String(n.id||uid()).slice(0,100);n.deck=String(n.deck||'Importiert').slice(0,200);
    n.tags=(Array.isArray(n.tags)?n.tags:[]).map(x=>String(x).slice(0,50)).slice(0,30);
    n.aliases=(Array.isArray(n.aliases)?n.aliases:[]).map(x=>String(x).slice(0,100)).slice(0,50);
    const keep=[];
    for(const a of n.atts||[]){
      const nm=String(a.name||'').split(/[\\/]/).pop().slice(0,200);a.name=nm;
      if(!nm||BAD_EXT.test(nm)||BAD_MIME.test(a.type||'')||(a.size||0)>50e6||keep.length>=30){w.blockedAtts++;continue}
      keep.push(a);
    }
    n.atts=keep;out.push(n);
  }
  P.notes=out;w.errors=0;w.hints=0;checkNotes(P.notes,w);w.fixed=out.filter(n=>n._typeNote).length;return w;
}
/* Inhaltsprüfung für importierte Notizen (z. B. KI-generierte Dateien): Fehler werden in der Vorschau abgewählt, Hinweise nur angezeigt. */
function checkNotes(notes,w){
  const seen=new Set();
  for(const n of notes){
    const f=n.fields||{},s=v=>String(v??'').trim(),err=[],hint=[];
    if(seen.has(n.id))err.push(t('ID kommt mehrfach in der Datei vor.'));seen.add(n.id);
    const hasAtt=(n.atts||[]).length>0;
    switch(n.type){
      case 'basic':case 'reversed':case 'typein':
        if(!s(f.front)&&!hasAtt)err.push(t('Vorderseite ist leer.'));
        if(!s(f.back)&&!hasAtt)(n.type==='basic'?hint:err).push(t('Rückseite ist leer.'));break;
      case 'cloze':if(!/\{\{c\d+::/.test(s(f.text)))err.push(t('Keine Lücke {{c1::…}} im Text.'));break;
      case 'mc':{const o=parseOptions(f.options);if(!s(f.front))err.push(t('Vorderseite ist leer.'));
        if(o.length<2)err.push(t('Weniger als 2 Antwortoptionen.'));else if(!o.some(x=>x.ok))hint.push(t('Keine Option als richtig (*) markiert.'));
        else if(o.every(x=>x.ok))hint.push(t('Alle Optionen sind als richtig markiert.'));break}
      case 'occlusion':if(!s(f.image)||!(f.masks||[]).length)err.push(t('Bild oder Masken fehlen.'));
        else if(!(n.atts||[]).some(a=>a.name===f.image))err.push(t('Das Bild „{0}“ ist nicht als Anhang enthalten.',f.image));break;
      case 'calc':{if(!s(f.front)||!s(f.answer)){err.push(t('Aufgabe oder Antwortausdruck fehlt.'));break}
        let bad=0,last='';for(let i=0;i<40;i++){try{calcInstance({fields:f})}catch(e){bad++;last=e.message}}
        if(bad===40)err.push(t('Rechenaufgabe nicht lösbar: {0}',last));else if(bad)hint.push(t('Rechenaufgabe scheitert bei {0} % der Zufallswerte ({1}).',Math.round(bad*100/40),last));break}
      default:{const m=modelOf(n.type);if(m&&!m.fields.some(k=>s(f[k])))err.push(t('Alle Felder der Vorlage sind leer.'))}
    }
    if(n._typeNote)hint.push(n._typeNote);
    n._check=err.length?{lvl:'error',msg:err.join(' ')}:hint.length?{lvl:'hint',msg:hint.join(' ')}:null;
    if(err.length)w.errors++;else if(hint.length)w.hints++;
  }
}

async function shrinkImage(blob,max=1600){
  try{
    if(!/^image\/(png|jpeg|webp|bmp)$/.test(blob.type)||!window.createImageBitmap)return blob;
    const bmp=await createImageBitmap(blob),sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    if(sc>=1&&blob.size<1.5e6){bmp.close&&bmp.close();return blob}
    const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(bmp.width*sc));cv.height=Math.max(1,Math.round(bmp.height*sc));
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);bmp.close&&bmp.close();
    const type=blob.type==='image/png'?'image/png':'image/jpeg',out=await new Promise(r=>cv.toBlob(r,type,.85));
    return out&&out.size<blob.size?out:blob;
  }catch{return blob}
}

const KDF_ITER=310000;
async function deriveKey(pw,salt,extractable=false){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:KDF_ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},extractable,['encrypt','decrypt']);
}
async function setBackupPassword(pw){const salt=crypto.getRandomValues(new Uint8Array(16)),key=await deriveKey(pw,salt);await metaSet('bkkey',{salt,key})}
async function encryptText(text,rec){
  const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},rec.key,new TextEncoder().encode(text));
  return JSON.stringify({format:'karteikarten-encrypted',v:1,kdf:'PBKDF2-SHA256',iter:KDF_ITER,salt:await blobToB64(new Blob([rec.salt])),iv:await blobToB64(new Blob([iv])),data:await blobToB64(new Blob([ct]))});
}
async function maybeDecrypt(j){
  if(!j||j.format!=='karteikarten-encrypted')return j;
  const pw=await askPassword(t('Passwort für das verschlüsselte Backup:'),false);if(!pw)throw new Error('cancel');
  const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(j.salt),iterations:j.iter||KDF_ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(j.iv)},key,u8(j.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

function projectMature(cards,weeks=8){

  const newList=cards.filter(c=>(S.states.get(c.id)||newState(c.id)).status==='new').sort((a,b)=>a.created-b.created||a.ord-b.ord);
  for(const c of cards){
    total++;const o=optFor(c.deck);let st={...(S.states.get(c.id)||newState(c.id))},t0=Date.now();
    if(st.status==='new'){const k=byDeckNew.get(c.deck)||0;byDeckNew.set(c.deck,k+1);t0=addDays(day0,Math.floor(k/Math.max(1,+o.newPerDay||20)))+3600e3}
    let matureAt=null;
    for(let i=0;i<40;i++){
      if(st.status==='review'&&st.interval>=21){matureAt=i===0?day0:t0;break}
      if(st.status!=='new'){t0=Math.max(t0,st.due)}
      if(t0>horizon)break;

  }
  return {res,total};
}

/* ---------- Barrierefreiheit: Beschriftungen automatisch verknüpfen ---------- */
const ARIA_MAP={'#fc-n':'Zeitraum','#fc-deck':'Stapel','#m-deck':'Stapel','#m-status':'Status','#m-tag':'Tag','#m-sort':'Sortierung','#sf-deck':'Stapel','#sf-n':'Zeitraum',
  '#im-file':'Dateien zum Import','#x-deck':'Stapel für den Export','#p-size':'Karten pro Seite','#b-deck':'Zielstapel','#b-flag':'Flagge','#sy-file':'Sync-Dateien','#bk-restore':'Backup wiederherstellen'};
function fixLabels(root=document){
  const CTL='input:not([type=hidden]),select,textarea';
  // 1) <label> direkt vor einem Feld (oder vor einem Block mit Feld) mit diesem Feld verknüpfen
  root.querySelectorAll('label:not(.inl):not(.btn):not(.opt)').forEach(l=>{
    if(l.querySelector(CTL)||l.htmlFor)return;
    let ctl=l.nextElementSibling;if(ctl&&!ctl.matches(CTL))ctl=ctl.matches('div,span')?ctl.querySelector(CTL):null;
    if(!ctl||ctl.getAttribute('aria-labelledby')||ctl.getAttribute('aria-label')||(ctl.labels&&ctl.labels.length))return;
    if(!l.id)l.id='lb'+Math.random().toString(36).slice(2,8);ctl.setAttribute('aria-labelledby',l.id);
  });
  // 2) bekannte Felder ohne Beschriftung
  for(const sel in ARIA_MAP){const el=root.querySelector?root.querySelector(sel):null;if(el&&!el.getAttribute('aria-label')&&!el.getAttribute('aria-labelledby')&&!(el.labels&&el.labels.length))el.setAttribute('aria-label',t(ARIA_MAP[sel]))}
  // 3) Rest: Titel, Platzhalter oder gewählte Option als Name
  root.querySelectorAll(CTL).forEach(el=>{
    if(el.type==='checkbox'||el.type==='radio'||el.type==='file'&&el.closest('label'))return;
    if(el.getAttribute('aria-label')||el.getAttribute('aria-labelledby')||(el.labels&&el.labels.length))return;
    const nm=el.title||el.placeholder||(el.tagName==='SELECT'&&el.selectedOptions[0]?el.selectedOptions[0].textContent.trim():'');
    if(nm)el.setAttribute('aria-label',nm);
  });
}
{let tm=0;new MutationObserver(()=>{clearTimeout(tm);tm=setTimeout(()=>{try{fixLabels()}catch{}},60)}).observe(document.body,{childList:true,subtree:true})}

function normUrl(u){
  let x;try{x=new URL(String(u).trim())}catch{return null}
  if(!/^https?:$/.test(x.protocol))return null;
  if(x.hostname==='github.com'){const m=/^\/([^/]+)\/([^/]+)\/(?:blob|raw)\/(.+)$/.exec(x.pathname);if(m)return `https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}`}
  return x.href;
}
const lkErr=(code,extra)=>{const e=new Error(code);e.code=code;e.extra=extra;return e};
async function fetchPackage(url,timeoutMs=20000){
  const u=normUrl(url);if(!u)throw lkErr('url');
  const ac=typeof AbortController!=='undefined'?new AbortController():null,to=ac&&setTimeout(()=>ac.abort(),timeoutMs);
  let r;
  try{r=await fetch(u,{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer',redirect:'follow',signal:ac?ac.signal:undefined})}
  catch(e){throw lkErr(ac&&ac.signal.aborted?'timeout':'net')}
  finally{if(to)clearTimeout(to)}
  if(!r.ok)throw lkErr('http',r.status);
  if((+r.headers.get('content-length')||0)>400e6)throw lkErr('big');
  const blob=await r.blob();if(blob.size>400e6)throw lkErr('big');
  let name='';try{name=decodeURIComponent(new URL(u).pathname.split('/').pop()||'')}catch{}
  const ct=(r.headers.get('content-type')||'').toLowerCase();
  if(!/\.(zip|json|csv|tsv)$/i.test(name))name=(name||'paket')+(ct.includes('zip')?'.zip':ct.includes('csv')?'.csv':'.json');
  return new File([blob],name,{type:blob.type});
}
const lkMsg=e=>e.code==='net'?t('Der Server hat die Anfrage blockiert oder ist nicht erreichbar. Häufigste Ursache: fehlende CORS-Freigabe (Access-Control-Allow-Origin). GitHub Pages und raw.githubusercontent.com funktionieren.')
  :e.code==='timeout'?t('Zeitüberschreitung beim Laden.'):e.code==='http'?t('Server antwortete mit Fehler {0}.',e.extra):e.code==='url'?t('Ungültige Adresse (nur http/https).'):e.code==='big'?t('Datei zu groß.'):String(e.message||e);

const SYNC_RE=/^karteikarten-sync-([0-9a-f]{4,16})\.zip$/;
let syncHandle=null,syncBusy=false,syncKeyCache=null,syncDirtyFlag=false,syncTimer=null;

async function loadSyncHandle(){if(syncHandle)return syncHandle;try{syncHandle=(await metaGet('syncdir'))||null}catch{}return syncHandle}
async function skey(){if(syncKeyCache!==null)return syncKeyCache||null;let r=null;try{r=await metaGet('synckey')}catch{}syncKeyCache=r?r.key:false;return r?r.key:null}
const u8b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function encBuf(buf){
  const k=await skey();if(!k)return new Uint8Array(buf);
  const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,buf)),out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);return out;
}
async function decBuf(buf){
  const k=await skey();if(!k)throw lkErr('locked');
  const u=new Uint8Array(buf);try{return await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},k,u.slice(12))}catch{throw lkErr('badkey')}
}
async function writeDirFile(dir,name,data){const fh=await dir.getFileHandle(name,{create:true}),w=await fh.createWritable();await w.write(data);await w.close()}
async function syncConfig(h,create){
  try{const fh=await h.getFileHandle('karteikarten-sync-config.json');return JSON.parse(await (await fh.getFile()).text())}catch{}
  if(!create)return null;
  const cfg={format:'karteikarten-sync-config',v:1,salt:await blobToB64(new Blob([crypto.getRandomValues(new Uint8Array(16))]))};
  await writeDirFile(h,'karteikarten-sync-config.json',JSON.stringify(cfg));return cfg;
}
async function setSyncPassword(){

}

  try{const h=await showDirectoryPicker({mode:'readwrite'});syncHandle=h;await metaSet('syncdir',h);S.settings.syncAuto=1;await saveSettings();toast(t('Sync-Ordner gesetzt: {0}',h.name));await syncRun(true);renderIO()}catch{}
}
async function disconnectSync(){syncHandle=null;await DB.tx(['meta'],tr=>tr.objectStore('meta').delete('syncdir'));S.settings.syncAuto=0;await saveSettings();S.syncNeedsPerm=false;renderBanner();renderIO()}

async function buildSyncDoc(){
  const tomb=S.settings.tomb||{},cut=Date.now()-180*DAY;for(const k in tomb)if(tomb[k]<cut)delete tomb[k];
  return {format:'karteikarten-sync',v:1,dev:devId(),name:S.settings.devName||'',ts:Date.now(),
    cards:[...S.cards.values()],states:[...S.states.values()].filter(s=>s.status!=='new'||s.reps||s.rst),
    decks:[...S.decks.values()].map(d=>({id:d.id,name:d.name,due:d.due||null,exam:d.exam||null,opt:d.opt||null})),
    tomb:{...tomb},models:S.settings.models||[],log:S.log.map(({id,...e})=>e)};
}
async function docToZipEntries(doc){
  const json=JSON.stringify(doc),k=await skey();
  return k?[{name:'sync.bin',data:new Blob([await encBuf(new TextEncoder().encode(json))])}]:[{name:'sync.json',data:json}];
}
async function zipEntriesToDoc(es){
  const e=es.find(x=>x.name==='sync.json')||es.find(x=>x.name==='sync.bin');if(!e)throw lkErr('format');
  let txt;if(e.name==='sync.bin')txt=new TextDecoder().decode(await decBuf(await e.blob.arrayBuffer()));else txt=await e.blob.text();
  const doc=JSON.parse(txt);if(!doc||doc.format!=='karteikarten-sync'||!Array.isArray(doc.cards))throw lkErr('format');return doc;
}
/* Eigene Datei + fehlende Anhänge in den Ordner schreiben (jedes Gerät schreibt nur seine eigene Datei -> keine Schreibkonflikte) */
async function syncWrite(h){
  const doc=await buildSyncDoc(),zip=await makeZip(await docToZipEntries(doc));
  await writeDirFile(h,`karteikarten-sync-${devId()}.zip`,zip);
  const md=await h.getDirectoryHandle('media',{create:true}),have=new Set();for await(const [n] of md.entries())have.add(n);
  const k=await skey();let n=0;
  for(const c of S.cards.values())for(const a of c.atts||[]){
    const plain=have.has(a.id),encd=have.has(a.id+'.enc');
    if(k){if(encd){if(plain){try{await md.removeEntry(a.id);have.delete(a.id)}catch{}}continue}}
    else if(plain||encd)continue;
    const m=await DB.get('media',a.id);if(!m)continue;
    if(k){await writeDirFile(md,a.id+'.enc',await encBuf(await m.blob.arrayBuffer()));have.add(a.id+'.enc');if(plain){try{await md.removeEntry(a.id);have.delete(a.id)}catch{}}}   // unverschlüsselte Kopie ersetzen
    else{await writeDirFile(md,a.id,m.blob);have.add(a.id)}
    n++;
  }
  return n;
}
async function readRemoteDocs(h){
  const out=[];out.ignored=[];
  for await(const [name,fh] of h.entries()){
    const m=SYNC_RE.exec(name);
    if(!m){if(/^karteikarten-sync-.*\.zip$/.test(name))out.ignored.push(name);continue}
    if(m[1]===devId())continue;
    const r={name,dev:m[1]};
    for(let attempt=0;attempt<2;attempt++){   // Cloud-Client schreibt die Datei evtl. gerade noch -> einmal erneut versuchen
      try{const f=await fh.getFile();r.size=f.size;r.doc=await zipEntriesToDoc(await readZip(f));r.ts=r.doc.ts;delete r.err;break}
      catch(e){r.err=e.code||String(e.message||e);if(e.code==='locked'||e.code==='badkey'||e.code==='format')break;await new Promise(res=>setTimeout(res,attempt?0:1500))}
    }
    out.push(r);
  }
  return out;
}
const folderMedia=h=>async id=>{
  try{const md=await h.getDirectoryHandle('media');
    try{const f=await (await md.getFileHandle(id+'.enc')).getFile();return new Blob([await decBuf(await f.arrayBuffer())])}catch(e){if(e.code==='locked'||e.code==='badkey')return null}
    try{return await (await md.getFileHandle(id)).getFile()}catch{}
  }catch{}
  return null;
};
/* Zusammenführen pro Karte: neuere Fassung (updated) gewinnt, Lernstand mit dem späteren letzten Lernzeitpunkt, Verlauf wird vereinigt,
   Löschungen laufen über Löschvermerke (Tombstones). Änderungen der Gegenseite werden vorher per Schnappschuss gesichert. */
async function syncMerge(docs,mediaGet){
  const st={added:0,upd:0,del:0,conf:0,states:0,log:0,media:0,missing:0,changed:false};
  if(!docs.length)return st;
  const lastSync=S.settings.lastSync||0;
  if(docs.some(d=>d.ts>lastSync)&&S.cards.size)await snapshot(t('Vor Sync'));
  for(const d of docs)await mergeModels(d.models);
  const tomb=S.settings.tomb=S.settings.tomb||{};
  for(const d of docs)for(const [id,ts] of Object.entries(d.tomb||{}))if(!(tomb[id]>=ts))tomb[id]=ts;
  const dmap=new Map();
  for(const d of docs)for(const rd of d.decks||[]){
    if(!rd||!rd.name)continue;let ld=deckByName(rd.name);if(!ld)ld=await ensureDeck(rd.name);
    dmap.set(d.dev+'|'+rd.id,ld.id);
    const nd={...S.decks.get(ld.id)};let ch=false;
    for(const k of ['due','exam','opt'])if(rd[k]&&!nd[k]){nd[k]=rd[k];ch=true}
    if(ch)await commit({decks:[nd]});
  }
  const best=new Map();
  for(const d of docs)for(const c of d.cards||[]){if(!c||!c.id)continue;const b=best.get(c.id);if(!b||(c.updated||0)>(b.c.updated||0))best.set(c.id,{c,dev:d.dev})}
  const have=new Set(await DB.keys('media')),cardPuts=[],cardDels=new Set(),newIds=new Set(),mediaPuts=[];
  let fallbackDeck=null;
  for(const id of new Set([...best.keys(),...Object.keys(tomb)])){
    const L=S.cards.get(id),B=best.get(id),T=tomb[id]||0;
    if(T&&(!L||T>(L.updated||0))&&(!B||T>=(B.c.updated||0))){if(L){cardDels.add(id);st.del++}continue}
    if(!B)continue;
    const R=B.c;
    if(L&&(R.updated||0)<=(L.updated||0))continue;
    let deck=dmap.get(B.dev+'|'+R.deck)||(L&&L.deck);
    if(!deck||!S.decks.has(deck)){fallbackDeck=fallbackDeck||(await ensureDeck('Importiert')).id;deck=fallbackDeck}
    if(L){if(lastSync>0&&(L.updated||0)>lastSync&&(R.updated||0)>lastSync)st.conf++;st.upd++}else{st.added++;newIds.add(id)}
    for(const a of R.atts||[]){if(have.has(a.id))continue;const bl=await mediaGet(a.id);
      if(bl){mediaPuts.push({id:a.id,blob:bl,name:a.name,type:a.type,size:bl.size});have.add(a.id);st.media++}else st.missing++;
      if(mediaPuts.length>=30)await commit({media:mediaPuts.splice(0)})}
    cardPuts.push({...R,deck});
  }
  if(mediaPuts.length)await commit({media:mediaPuts.splice(0)});
  // Zeitpunkt des letzten Ereignisses: Lernen oder Zurücksetzen (rst) – das spätere gewinnt
  const eff=s=>Math.max(s.last||0,s.rst||0),newer=(a,b)=>!b||eff(a)>eff(b)||(eff(a)===eff(b)&&(a.reps||0)>(b.reps||0));
  const sp=new Map();
  for(const d of docs)for(const rs of d.states||[]){
    if(!rs||!(S.cards.has(rs.id)||newIds.has(rs.id))||cardDels.has(rs.id))continue;
    const cur=sp.get(rs.id)||S.states.get(rs.id);if(newer(rs,cur))sp.set(rs.id,rs);
  }
  st.states=sp.size;
  const key=e=>e.ts+'|'+e.card+'|'+e.r,seen=new Set(S.log.map(key)),add=[];
  for(const d of docs)for(const e of d.log||[]){if(!e||!e.ts)continue;const k=key(e);if(!seen.has(k)){seen.add(k);add.push(e)}}
  for(let i=0;i<add.length;i+=5000){const ch=add.slice(i,i+5000);await DB.tx(['log'],tr=>ch.forEach(e=>tr.objectStore('log').add({...e})))}
  st.log=add.length;
  await commit({cards:cardPuts,states:[...sp.values()]},{cards:[...cardDels],states:[...cardDels]});
  if(add.length){S.log=await DB.all('log');S.log.sort((a,b)=>a.ts-b.ts)}
  refreshToday();S.rev++;await saveSettings();
  st.changed=!!(st.added||st.upd||st.del||st.states||st.log||st.media);
  return st;
}
function syncReport(st,remote){
  const bad=remote.filter(r=>r.err);
  let m;
  if(!remote.length)m=t('Sync-Datei geschrieben. Noch kein anderes Gerät gefunden.');
  else m=t('Sync: {0} neu, {1} aktualisiert, {2} gelöscht, {3} Lernstände, {4} Verlaufseinträge',st.added,st.upd,st.del,st.states,st.log);
  if(st.conf)m+=' · '+t('{0} Konflikte (neuere Fassung behalten, Schnappschuss angelegt)',st.conf);
  if(st.missing)m+=' · '+t('{0} Anhänge fehlen noch im Ordner',st.missing);
  if(remote.ignored&&remote.ignored.length)m+=' · '+t('{0} Konfliktkopie(n) der Cloud ignoriert',remote.ignored.length);
  if(bad.length)m+=' · '+t('{0} Datei(en) nicht lesbar (verschlüsselt/Passwort?)',bad.length);
  toast(m);announce(m);
}
/* Prüft, ob der gewählte Ordner wirklich funktioniert: Berechtigung, Schreiben, Zurücklesen, Auflisten, Löschen */
async function testSyncDir(){
  const h=await loadSyncHandle();if(!h)return;
  const steps=[];const step=async(n,fn)=>{try{const r=await fn();steps.push('✅ '+n+(r?' ('+r+')':''));return true}catch(e){steps.push('❌ '+n+': '+(e.message||e));return false}};
  const name='karteikarten-sync-test.tmp',payload='test-'+Date.now();
  if(await step(t('Zugriff'),async()=>{if(!await dirOk(h,true))throw new Error(t('nicht erlaubt'))}))
  if(await step(t('Schreiben'),()=>writeDirFile(h,name,payload)))
  if(await step(t('Zurücklesen'),async()=>{const tx=await (await (await h.getFileHandle(name)).getFile()).text();if(tx!==payload)throw new Error(t('Inhalt weicht ab'))}))
  if(await step(t('Auflisten'),async()=>{let n=0;for await(const _ of h.entries())n++;return n+' '+t('Einträge')}))
  await step(t('Unterordner „media“'),async()=>{await h.getDirectoryHandle('media',{create:true})});
  await step(t('Aufräumen'),()=>h.removeEntry(name));
  const d=dlg(`<h2>${t('Ordner-Test')}</h2><div>${steps.map(s=>`<div>${esc(s)}</div>`).join('')}</div><div class="small mut" style="margin-top:8px">${t('Hinweis: Cloud-Ordner synchronisieren zeitversetzt. Ein zweites Gerät sieht neue Dateien erst, wenn der Cloud-Client sie geladen hat.')}</div><div class="flex" style="margin-top:12px;justify-content:flex-end"><button class="pri" id="st-x">OK</button></div>`);
  $('#st-x',d).onclick=()=>d.close();
}
async function syncRun(gesture){
  if(syncBusy)return null;syncBusy=true;
  try{
    const h=await loadSyncHandle();if(!h)return null;
    if(!await dirOk(h,gesture)){S.syncNeedsPerm=true;renderBanner();return null}
    S.syncNeedsPerm=false;
    const remote=await readRemoteDocs(h),docs=remote.filter(r=>r.doc).map(r=>r.doc);
    const st=await syncMerge(docs,folderMedia(h));
    await syncWrite(h);
    S.settings.lastSync=Date.now();await saveSettings();syncDirtyFlag=false;renderBanner();
    syncReport(st,remote);st.remote=remote;return st;
  }catch(e){toast(t('Sync fehlgeschlagen: {0}',e.message||e));return null}
  finally{syncBusy=false}
}
/* nur schreiben (kein Zusammenführen): läuft automatisch nach Änderungen, stört also nie laufende Lernsitzungen */
function syncDirty(){
  syncDirtyFlag=true;
  if(!syncHandle||!S.settings.syncAuto)return;
  clearTimeout(syncTimer);syncTimer=setTimeout(syncWriteOnly,60000);
}
async function syncWriteOnly(){
  if(syncBusy||!syncHandle||!syncDirtyFlag)return;
  try{if(!await dirOk(syncHandle,false))return;syncBusy=true;await syncWrite(syncHandle);syncDirtyFlag=false}catch{}finally{syncBusy=false}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){clearTimeout(syncTimer);syncWriteOnly()}});
/* Datei-Austausch für Browser ohne Ordnerzugriff (Firefox, Safari, iOS) */
async function syncExportFile(withMedia){
  const doc=await buildSyncDoc(),es=await docToZipEntries(doc),k=await skey();
  if(withMedia)for(const c of S.cards.values())for(const a of c.atts||[]){
    if(es.some(e=>e.name==='media/'+a.id||e.name==='media/'+a.id+'.enc'))continue;
    const m=await DB.get('media',a.id);if(m)es.push({name:'media/'+a.id+(k?'.enc':''),data:k?new Blob([await encBuf(await m.blob.arrayBuffer())]):m.blob});
  }
  download(await makeZip(es),`karteikarten-sync-${devId()}.zip`);toast(t('Sync-Datei gespeichert. Auf dem anderen Gerät unter „Sync-Dateien zusammenführen“ öffnen.'));
}
async function syncFromFiles(files){
  const docs=[],media=new Map();let bad=0;
  for(const f of files){
    try{const es=await readZip(f);docs.push(await zipEntriesToDoc(es));for(const e of es){const m=/^media\/(.+?)(\.enc)?$/.exec(e.name);if(m)media.set(m[1],{blob:e.blob,enc:!!m[2]})}}
    catch(e){bad++}
  }
  if(!docs.length){toast(t('Keine gültige Sync-Datei ({0} Datei(en) nicht lesbar).',bad));return}
  const get=async id=>{const m=media.get(id);if(!m)return null;try{return m.enc?new Blob([await decBuf(await m.blob.arrayBuffer())]):m.blob}catch{return null}};
  const st=await syncMerge(docs,get);
  S.settings.lastSync=Date.now();await saveSettings();syncReport(st,docs.map(d=>({doc:d})));if(VIEW!=='study')go(VIEW);
}
async function startupSync(){
  const h=await loadSyncHandle();
  if(h&&S.settings.syncAuto){
    if(await dirOk(h,false)){const r=await syncRun(false);if(r&&r.changed&&VIEW!=='study')go(VIEW)}
    else{S.syncNeedsPerm=true;renderBanner()}
  }
  autoLinkCheck();
}

}).catch(e=>{window.__booted=true;applyStatic();$('#v-home').classList.add('on');$('#v-home').innerHTML='<div class="box"><p>'+esc(t('Datenbank konnte nicht geöffnet werden: ')+e)+'<br>'+esc(t('Bitte die Datei nicht im privaten Modus öffnen.'))+'</p></div>'});
</script>
